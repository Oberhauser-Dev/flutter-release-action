name: 'Flutter Release Action'
description: 'Build, release, publish and deploy Flutter apps (Web, Android, iOS, macOS, Linux, Windows).'
author: 'August Oberhauser'
branding:
  icon: 'smartphone'
  color: 'purple'
inputs:
  token:
    description: "Authorized secret GitHub Personal Access Token. Defaults to github.token"
    required: false
    default: ${{ github.token }}
  working-directory:
    description: 'Specifies the working directory where the command is run.'
    required: false
    default: './'
  dry-run:
    description: 'Whether the process should only run dry.'
    required: false
    default: 'true'
  verbose:
    description: 'Whether the process should log processes.'
    required: false
    default: 'false'
  app-name:
    description: 'The name of the app executable. Uses the `name` of pubspec.yaml by default.'
    required: false
    default: ''
  app-version:
    description: 'Semantic version of the release, see https://semver.org/. Uses the `version` of pubspec.yaml by default.'
    required: false
    default: ''
  build-metadata:
    description: 'Override build metadata (build number, appends +), see https://semver.org/.'
    required: false
    default: ''
  build-pre-release:
    description: 'Override build pre-release (appends -), see https://semver.org/.'
    required: false
    default: ''
  tag:
    description: 'The tag of the release. Could be the same as the version. Only needed for build to upload assets. Default is `github.ref`'
    required: false
    default: ${{ github.ref }}
  upload-release-asset:
    description: 'Whether to upload the build artifact to the GitHub release of the `tag` (`true` or `false`). By default, all build types are uploaded except `msix-store`, as the Microsoft Store package is unsigned.'
    required: false
    default: ''
  upload-workflow-artifact:
    description: 'Whether to upload the build artifact as workflow artifact (`true` or `false`), e.g. to publish it in a later job. By default, only `msix-store` builds are uploaded, which are used by the `windows-ms-store` distributor.'
    required: false
    default: ''
  build-args:
    description: 'Add options such as "--dart-define" to the flutter build command.'
    required: false
    default: ''
  build-type:
    description: 'Build one of the following options: apk, aab, web, ios, ipa, macos, windows, msix, msix-store, linux, debian.'
    default: ''
    required: false
  main-path:
    description: 'The path to the dart executable. Default is `lib/main.dart`.'
    default: ''
    required: false
  flavor:
    description: 'The app flavor.'
    default: ''
    required: false
  publish-stage:
    description: 'At which stage the app should be published: production, beta, alpha, internal.'
    required: false
    default: ''
  publish-distributor:
    description: 'The distributor on which the app should be published: android-google-play, web-server, ios-app-store, mac-app-store, windows-ms-store, linux-ubuntu, linux-snap.'
    required: false
    default: ''
  # ANDROID
  android-keystore-file-base64:
    description: 'The Keystore file as base64 string.'
    required: false
    default: ''
  android-keystore-password:
    description: 'The Keystore Password.'
    required: false
    default: ''
  android-key-alias:
    description: 'The key alias of the keystore.'
    required: false
    default: ''
  android-key-password:
    description: 'The password of the key alias of the keystore. Uses the keystore password by default.'
    required: false
    default: ''
  publish-android-fastlane-secrets-json-base64:
    description: 'The Google Play Credentials Json file as base64 string.'
    required: false
    default: ''
  publish-android-release-status:
    description: 'The release status. One of: completed, draft, halted, inProgress'
    required: false
    default: ''
  # IOS
  ios-apple-username:
    description: 'The Apple ID / iTunes username.'
    required: false
    default: ''
  ios-api-key-id:
    description: 'The key id of your App Store Connect API key, see https://appstoreconnect.apple.com/access/integrations/api .'
    required: false
    default: ''
  ios-api-issuer-id:
    description: 'The issuer id of your App Store Connect API key, see https://appstoreconnect.apple.com/access/integrations/api .'
    required: false
    default: ''
  ios-api-private-key-base64:
    description: 'The private App Store Connect API key as base64 string, see https://appstoreconnect.apple.com/access/integrations/api .'
    required: false
    default: ''
  ios-content-provider-id:
    description: 'The content provider id, also known as `itc_team_id` in fastlane.'
    required: false
    default: ''
  ios-team-id:
    description: 'The team id, also known as `team_id` in fastlane.'
    required: false
    default: ''
  ios-team-enterprise:
    description: 'Whether your team is in the Apple Developer Enterprise Program.'
    required: false
    default: 'false'
  ios-distribution-private-key-base64:
    description: 'The private key (as base64 string) connected to the Distribution certificate.'
    required: false
    default: ''
  ios-distribution-cert-base64:
    description: 'The certificate (as base64 string) connected to the Provisioning profile used to sign the app.'
    required: false
    default: ''
  ios-update-provisioning:
    description: 'Try to update and match the Provisioning profile used to sign the app. Default is `false`.'
    required: false
    default: 'false'
  ios-xcode-scheme:
    description: 'Specify the scheme used by XCode in order to build and sign the app. Falls back to the `flavor` input, if set. Default is `Runner`.'
    required: false
    default: ''
  # WINDOWS
  windows-certificate-file-base64:
    description: 'The certificate (.pfx) as base64 string to sign the MSIX installer.'
    required: false
    default: ''
  windows-certificate-password:
    description: 'The password of the certificate.'
    required: false
    default: ''
  windows-msix-publisher:
    description: 'The publisher of the MSIX installer (e.g. `CN=...`), required for the Microsoft Store (`msix-store`). When signing, it must match the subject of the certificate.'
    required: false
    default: ''
  windows-msix-identity-name:
    description: 'The identity name of the MSIX installer, required for the Microsoft Store (`msix-store`).'
    required: false
    default: ''
  windows-msix-publisher-display-name:
    description: 'The display name of the publisher of the MSIX installer, required for the Microsoft Store (`msix-store`).'
    required: false
    default: ''
  publish-windows-tenant-id:
    description: 'The Microsoft Entra tenant id associated with the Partner Center account.'
    required: false
    default: ''
  publish-windows-client-id:
    description: 'The client id of the Microsoft Entra application with access to the Partner Center account.'
    required: false
    default: ''
  publish-windows-client-secret:
    description: 'The client secret of the Microsoft Entra application.'
    required: false
    default: ''
  publish-windows-seller-id:
    description: 'The seller id of the Partner Center account.'
    required: false
    default: ''
  publish-windows-product-id:
    description: 'The Store id of the app (e.g. `9N...`), see Partner Center > Product identity.'
    required: false
    default: ''
  publish-windows-flight-id:
    description: 'The package flight to publish to, publishes to the public by default.'
    required: false
    default: ''
  publish-windows-rollout-percentage:
    description: 'The rollout percentage of the package (0-100).'
    required: false
    default: ''
  publish-windows-release-status:
    description: 'The status of the submission: draft (default) or completed (submit for certification).'
    required: false
    default: ''
  publish-windows-packages:
    description: 'Newline separated paths of the MSIX packages built via `msix-store` (e.g. one per architecture). Multiple packages are published as bundle. By default, the packages uploaded as workflow artifacts by `msix-store` builds of the same workflow run are used.'
    required: false
    default: ''
  # WEB
  publish-web-host:
    description: 'The hoster of the web app, e.g. the domain or ip address.'
    required: false
    default: ''
  publish-web-path:
    description: 'The Web servers path to your html space of the app.'
    required: false
    default: ''
  publish-web-ssh-port:
    description: 'The Web server SSH port.'
    required: false
    default: ''
  publish-web-ssh-user:
    description: 'The Web server SSH user.'
    required: false
    default: ''
  publish-web-ssh-private-key-base64:
    description: 'The private ssh key (as base64 string) of this GitHub action server.'
    required: false
    default: ''


outputs:
  artifact-name:
    description: "The name of the app build artifact"
    value: ${{ steps.build.outputs.artifact-name }}

runs:
  using: "composite"
  steps:
    - name: Install current bash on macOS
      if: runner.os == 'macOS'
      run: |
        brew install bash
        bash --version
      shell: bash
    - name: Prepare
      id: prepare
      # Remove leading and trailing newline, if existent.
      # Add a newline at the beginning, if string is not empty.
      # Replace newline with ` --build-arg=`
      run: |
        dart pub global activate flutter_release '<1.0.0'

        ln=$'\n'
        buildArgs='${{ inputs.build-args }}'
        # Remove empty lines
        buildArgs=$(echo "$buildArgs" | sed '/^[[:space:]]*$/d')
        # Adding a Newline Prefix (if non-empty) and replace newline with `--build-arg`
        if [ ! -z "${buildArgs}" ]; then
            buildArgs="$ln$buildArgs"
            buildArgs="${buildArgs//$'\n'/' --build-arg='}"
        fi
        echo "build-args=$(echo $buildArgs)" >> $GITHUB_OUTPUT

        # Key of the workflow artifacts, the publish distributor `windows-ms-store` consumes `msix-store` builds.
        artifactKey="flutter-release-${{ inputs.publish-distributor == 'windows-ms-store' && 'msix-store' || inputs.build-type }}"
        appName='${{ inputs.app-name }}'
        flavor='${{ inputs.flavor }}'
        if [ ! -z "$appName" ]; then artifactKey="$artifactKey-$appName"; fi
        if [ ! -z "$flavor" ]; then artifactKey="$artifactKey-$flavor"; fi
        echo "artifact-key=$artifactKey" >> $GITHUB_OUTPUT
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Build App
      if: inputs.publish-distributor == ''
      id: build
      run: |
        ARTIFACT_PATH=$(dart pub global run flutter_release build \
          ${{ inputs.build-type == 'msix-store' && 'msix --store' || inputs.build-type }} \
          ${{ inputs.app-name != '' && format('--app-name={0}', inputs.app-name) || '' }} \
          ${{ inputs.app-version != '' && format('--app-version={0}', inputs.app-version) || '' }} \
          ${{ inputs.build-metadata != '' && format('--build-metadata={0}', inputs.build-metadata) || '' }} \
          ${{ inputs.build-pre-release != '' && format('--build-pre-release={0}', inputs.build-pre-release) || '' }} \
          ${{ inputs.main-path != '' && format('--main-path={0}', inputs.main-path) || '' }} \
          ${{ inputs.flavor != '' && format('--flavor={0}', inputs.flavor) || '' }} \
          ${{ steps.prepare.outputs.build-args }} \
          ${{ ((inputs.build-type == 'apk' || inputs.build-type == 'aab') && inputs.android-keystore-file-base64 != '' && inputs.android-keystore-password != '' && inputs.android-key-alias != '') && format('--keystore-file-base64={0} --keystore-password={1} --key-alias={2} {3}', inputs.android-keystore-file-base64, inputs.android-keystore-password, inputs.android-key-alias, inputs.android-key-password != '' && format('--key-password={0}', inputs.android-key-password) || '') || '' }} \
          ${{ (inputs.build-type == 'msix' && inputs.windows-certificate-file-base64 != '') && format('--certificate-file-base64={0} --certificate-password={1}', inputs.windows-certificate-file-base64, inputs.windows-certificate-password) || '' }} \
          ${{ ((inputs.build-type == 'msix' || inputs.build-type == 'msix-store') && inputs.windows-msix-publisher != '') && format('--publisher="{0}"', inputs.windows-msix-publisher) || '' }} \
          ${{ ((inputs.build-type == 'msix' || inputs.build-type == 'msix-store') && inputs.windows-msix-identity-name != '') && format('--identity-name="{0}"', inputs.windows-msix-identity-name) || '' }} \
          ${{ ((inputs.build-type == 'msix' || inputs.build-type == 'msix-store') && inputs.windows-msix-publisher-display-name != '') && format('--publisher-display-name="{0}"', inputs.windows-msix-publisher-display-name) || '' }} \
          ${{ inputs.verbose != 'false' && '--verbose' || '' }} \
          | tail -1)
        ARTIFACT_NAME=$(basename "$ARTIFACT_PATH")
        echo "Artifact Path: $ARTIFACT_PATH"
        echo "artifact-path=$ARTIFACT_PATH" >> $GITHUB_OUTPUT
        echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
      shell: bash
      working-directory: ${{ inputs.working-directory }}
    - name: Upload binaries to release
      # Only upload to GitHub if in build mode.
      if: >-
        inputs.dry-run == 'false' && inputs.publish-distributor == '' &&
        (inputs.upload-release-asset == 'true' || (inputs.upload-release-asset == '' && inputs.build-type != 'msix-store'))
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ inputs.token }}
        file: ${{ inputs.working-directory }}${{ (!endsWith(inputs.working-directory, '/') && '/') || '' }}${{ steps.build.outputs.artifact-path }}
        asset_name: ${{ steps.build.outputs.artifact-name }}
        tag: ${{ inputs.tag }}
    - name: Upload workflow artifact
      if: >-
        inputs.publish-distributor == '' &&
        (inputs.upload-workflow-artifact == 'true' || (inputs.upload-workflow-artifact == '' && inputs.build-type == 'msix-store'))
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.prepare.outputs.artifact-key }}-${{ runner.os }}-${{ runner.arch }}
        path: ${{ inputs.working-directory }}${{ (!endsWith(inputs.working-directory, '/') && '/') || '' }}${{ steps.build.outputs.artifact-path }}
        if-no-files-found: error
        retention-days: 1
    - run: echo "${{ inputs.dry-run == 'false' && 'Release' || 'Dry run' }} for ${{ inputs.build-type }} was successful!"
      shell: bash
      if: inputs.publish-distributor == ''

    - name: Setup Microsoft Store Developer CLI
      if: inputs.publish-distributor == 'windows-ms-store'
      uses: microsoft/microsoft-store-apppublisher@v1
    - name: Download Microsoft Store packages
      if: inputs.publish-distributor == 'windows-ms-store' && inputs.publish-windows-packages == ''
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ steps.prepare.outputs.artifact-key }}-*
        path: ${{ inputs.working-directory }}${{ (!endsWith(inputs.working-directory, '/') && '/') || '' }}build/flutter-release-msix-store
        merge-multiple: true
    - name: Collect Microsoft Store packages
      id: windows-packages
      if: inputs.publish-distributor == 'windows-ms-store'
      run: |
        packages='${{ inputs.publish-windows-packages }}'
        if [ -z "${packages//[[:space:]]}" ]; then
          packages=$(ls build/flutter-release-msix-store/*.msix 2>/dev/null || true)
        fi
        packages=$(echo "$packages" | sed '/^[[:space:]]*$/d')
        if [ -z "$packages" ]; then
          echo "::error::No MSIX packages found. Build them via 'msix-store' in a previous job of this workflow run or pass them via 'publish-windows-packages'."
          exit 1
        fi
        echo "Packages:"
        echo "$packages"

        packageArgs=''
        while IFS= read -r package; do
          packageArgs="$packageArgs --package=\"$package\""
        done <<< "$packages"
        echo "package-args=$packageArgs" >> $GITHUB_OUTPUT
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Publish
      if: inputs.publish-distributor != ''
      run: |
        dart pub global run flutter_release publish \
          ${{ inputs.publish-distributor }} \
          ${{ inputs.publish-stage != '' && format('--stage={0}', inputs.publish-stage) || '' }} \
          ${{ inputs.app-name != '' && format('--app-name={0}', inputs.app-name) || '' }} \
          ${{ inputs.app-version != '' && format('--app-version={0}', inputs.app-version) || '' }} \
          ${{ inputs.build-metadata != '' && format('--build-metadata={0}', inputs.build-metadata) || '' }} \
          ${{ inputs.build-pre-release != '' && format('--build-pre-release={0}', inputs.build-pre-release) || '' }} \
          ${{ inputs.main-path != '' && format('--main-path={0}', inputs.main-path) || '' }} \
          ${{ inputs.flavor != '' && format('--flavor={0}', inputs.flavor) || '' }} \
          ${{ steps.prepare.outputs.build-args }} \
          ${{ inputs.publish-distributor == 'android-google-play' && format('--keystore-file-base64={0} --keystore-password={1} --key-alias={2} {3} --fastlane-secrets-json-base64={4} {5}', inputs.android-keystore-file-base64, inputs.android-keystore-password, inputs.android-key-alias, inputs.android-key-password != '' && format('--key-password={0}', inputs.android-key-password) || '', inputs.publish-android-fastlane-secrets-json-base64, inputs.publish-android-release-status != '' && format('--release-status={0}', inputs.publish-android-release-status) || '') || '' }} \
          ${{ inputs.publish-distributor == 'web-server' && format('--host={0} --path={1} --ssh-port={2} --ssh-user={3} --ssh-private-key-base64={4}', inputs.publish-web-host, inputs.publish-web-path, inputs.publish-web-ssh-port, inputs.publish-web-ssh-user, inputs.publish-web-ssh-private-key-base64) || '' }} \
          ${{ inputs.publish-distributor == 'ios-app-store' && format('--apple-username={0} --api-key-id={1} --api-issuer-id={2} --api-private-key-base64={3} --content-provider-id={4} --team-id={5} --distribution-private-key-base64={6} --distribution-cert-base64={7} --update-provisioning={8} {9} {10}', inputs.ios-apple-username, inputs.ios-api-key-id, inputs.ios-api-issuer-id, inputs.ios-api-private-key-base64, inputs.ios-content-provider-id, inputs.ios-team-id, inputs.ios-distribution-private-key-base64, inputs.ios-distribution-cert-base64, inputs.ios-update-provisioning, inputs.ios-xcode-scheme != '' && format('--xcode-scheme={0}', inputs.ios-xcode-scheme) || '', inputs.ios-team-enterprise == 'true' && '--team-enterprise' || '') || '' }} \
          ${{ inputs.publish-distributor == 'windows-ms-store' && format('--tenant-id={0} --client-id={1} --client-secret=''{2}'' --seller-id={3} --product-id={4} {5} {6} {7}', inputs.publish-windows-tenant-id, inputs.publish-windows-client-id, inputs.publish-windows-client-secret, inputs.publish-windows-seller-id, inputs.publish-windows-product-id, inputs.publish-windows-flight-id != '' && format('--flight-id={0}', inputs.publish-windows-flight-id) || '', inputs.publish-windows-rollout-percentage != '' && format('--rollout-percentage={0}', inputs.publish-windows-rollout-percentage) || '', inputs.publish-windows-release-status != '' && format('--release-status={0}', inputs.publish-windows-release-status) || '') || '' }} \
          ${{ inputs.publish-distributor == 'windows-ms-store' && steps.windows-packages.outputs.package-args || '' }} \
          ${{ inputs.dry-run != 'false' && '--dry-run' || '' }} \
          ${{ inputs.verbose != 'false' && '--verbose' || '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
